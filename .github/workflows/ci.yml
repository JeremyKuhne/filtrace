# Build and test filtrace on Windows and Linux.
#
# Linux ARM64 owns the cross-platform product and contract checks. Windows runs
# the full test suite plus the deterministic eval so Windows-only ETL and
# thread-time paths stay in the automatic gate without duplicating every
# cross-platform contract. A separate job verifies the pinned agent skills. The
# stable `ci` aggregator preserves the required status-check name while running
# on the cheapest hosted runner.
name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-files:
    name: agent files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pinned skills, overlays, and links
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Test-AgentSkills.ps1 -VerifyUpstream -ReferenceValidation

  build-linux:
    name: build (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer derives the build version from git history and tags

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-filtrace-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-filtrace-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore filtrace.slnx

      - name: Build
        run: dotnet build filtrace.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test filtrace.slnx --configuration Release --no-build

      - name: Help lint
        shell: pwsh
        run: ./tools/Test-CliHelp.ps1 -Configuration Release

      - name: MCP server check
        shell: pwsh
        run: ./tools/Test-McpServer.ps1 -Configuration Release

      - name: Docs drift check
        shell: pwsh
        run: ./tools/Test-Docs.ps1

      - name: Release provenance contract
        shell: pwsh
        run: ./tools/Test-ReleaseReadiness.ps1

      - name: Release package failure contract
        shell: pwsh
        run: ./tools/Test-ReleasePackagesContract.ps1

      - name: Pack and smoke-test CLI/MCP deployment
        shell: pwsh
        run: |
          dotnet pack filtrace.slnx --configuration Release --no-build --output artifacts/release-package-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Release candidate pack failed.' }
          $version = (dotnet msbuild src/Filtrace/Filtrace.csproj -target:MinVer -property:Configuration=Release -getProperty:PackageVersion -verbosity:quiet -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the candidate package version.' }
          ./tools/Test-ReleasePackages.ps1 `
            -PackagesDirectory artifacts/release-package-candidate `
            -ExpectedVersion $version `
            -OutputDirectory artifacts/release-package-smoke

      - name: Capture helper contract
        shell: pwsh
        run: ./tools/Test-CaptureBenchmarkTrace.ps1

      - name: Command capture contract
        shell: pwsh
        run: ./tools/Test-CaptureCommandTrace.ps1

      - name: Project capture contract
        shell: pwsh
        run: ./tools/Test-CaptureProjectTrace.ps1

      - name: Analysis record contract
        shell: pwsh
        run: ./tools/Test-FiltraceAnalysis.ps1 -Configuration Release

      - name: Track D investigation contract
        shell: pwsh
        run: ./tools/Test-TrackDInvestigation.ps1

  build-windows:
    name: build (Windows)
    runs-on: windows-latest
    # The prerequisite Windows matrix takes about nine minutes; the fail-closed
    # fake-host contract adds about six. Keep bounded headroom for hosted variance.
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer derives the build version from git history and tags

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-filtrace-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-filtrace-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore filtrace.slnx

      - name: Build
        run: dotnet build filtrace.slnx --configuration Release --no-restore

      - name: Test
        # The machine-wide CLR rundown and child-process tests must not compete
        # with other managed test hosts for ETW provider activation and startup.
        shell: pwsh
        run: ./tools/Test-WindowsDotNet.ps1

      # Hosted Windows runners run elevated, so the one path that needs a real ETW
      # capture is checked here rather than left to a developer box. All builds
      # and ETW-dependent tests must finish before overlapping the fake-driven
      # contracts below; other managed builds can fault while GC heap-dump is live.
      - name: Native symbol resolution gate
        shell: pwsh
        run: ./tools/Test-NativeSymbolResolution.ps1 -Configuration Release -Require

      # Linux ARM64 runs the complete portable command-capture contract. This
      # Windows gate keeps its native argv, PS5.1, and failure witnesses, while
      # overlapping independent work with the expensive isolated fake agent.
      - name: Windows contract gates
        shell: pwsh
        run: ./tools/Test-WindowsContracts.ps1

  # The main ruleset requires this stable check name. `if: always()` and the
  # explicit result checks turn upstream failures or cancellations into a red
  # required check rather than a skipped one.
  ci:
    name: ci
    needs: [agent-files, build-linux, build-windows]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify CI jobs succeeded
        shell: bash
        run: |
          results=(
            "agent-files=${{ needs.agent-files.result }}"
            "build-linux=${{ needs.build-linux.result }}"
            "build-windows=${{ needs.build-windows.result }}"
          )
          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            case "$result" in
              *=success) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
